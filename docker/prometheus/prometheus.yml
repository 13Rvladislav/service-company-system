
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # Сам Prometheus
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Auth Service
  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081

  # User Service
  - job_name: user-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8082

  # Equipment Service
  - job_name: equipment-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8083

  # Request Service
  - job_name: request-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8084
