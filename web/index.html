<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Company</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Inter,Arial,sans-serif;
        }

        body{
            background:#eef2f7;
        }

        .hidden{
            display:none;
        }

        #loginPage{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:420px;
            background:white;
            border-radius:18px;
            padding:35px;
            box-shadow:0 12px 30px rgba(0,0,0,.08);
        }

        h1{
            color:#1e293b;
            margin-bottom:8px;
        }

        .subtitle{
            color:#64748b;
            margin-bottom:24px;
            font-size:14px;
        }

        input{
            width:100%;
            padding:13px;
            border:1px solid #d1d5db;
            border-radius:10px;
            margin-bottom:14px;
            font-size:15px;
        }
        .avatar-btn{
            width:auto;
            padding:8px 14px;
            height:34px;

            background:#f3f4f6;
            color:#374151;

            border:1px solid #d1d5db;
            border-radius:8px;

            font-size:13px;
            font-weight:500;
            cursor:pointer;
        }

        .avatar-btn:hover{
            background:#e5e7eb;
        }
        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            cursor:pointer;
            font-weight:600;
            font-size:15px;
        }

        button:hover{
            background:#1d4ed8;
        }

        .forgot{
            text-align:center;
            margin-top:18px;
        }

        .forgot a{
            text-decoration:none;
            color:#2563eb;
            font-size:14px;
        }

        #error{
            margin-top:14px;
            color:#dc2626;
            font-size:14px;
        }

        /* APP */

        #appPage{
            display:none;
            height:100vh;
        }

        .layout{
            display:flex;
            height:100%;
        }

        .sidebar{
            width:250px;
            background:#0f172a;
            color:white;
            display:flex;
            flex-direction:column;
            padding:24px;
        }

        .logo{
            margin-bottom:30px;
        }

        .logo h2{
            margin-bottom:4px;
        }

        .logo p{
            color:#94a3b8;
            font-size:13px;
        }

        .user{
            margin-bottom:25px;
        }

        .user strong{
            display:block;
        }

        .user span{
            color:#94a3b8;
            font-size:13px;
        }

        .role{
            display:inline-block;
            margin-top:8px;
            padding:5px 10px;
            border-radius:20px;
            background:#1e40af;
            font-size:12px;
        }

        .menu button{
            background:#1e293b;
            text-align:left;
            margin-bottom:8px;
        }

        .menu button:hover{
            background:#334155;
        }

        .logout{
            margin-top:auto;
            background:#dc2626 !important;
        }

        .content{
            flex:1;
            padding:32px;
            overflow:auto;
        }

        .panel{
            background:white;
            border-radius:18px;
            padding:24px;
            box-shadow:0 8px 20px rgba(0,0,0,.05);
        }

        .panel h2{
            margin-bottom:20px;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:18px;
        }

        .field label{
            display:block;
            font-size:13px;
            color:#64748b;
            margin-bottom:6px;
        }

        .field input{
            margin:0;
            background:#f8fafc;
        }

        .full{
            grid-column:1/3;
        }
    </style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

    <div class="card">

        <h1>Авторизация</h1>

        <div class="subtitle">
            Войдите в систему сервисной компании
        </div>

        <input
                id="email"
                type="email"
                placeholder="Email">

        <input
                id="password"
                type="password"
                placeholder="Пароль">

        <button id="loginBtn">
            Войти
        </button>

        <div class="forgot">
            <a href="forgot.html">
                Забыли пароль?
            </a>
        </div>

        <div id="error"></div>

    </div>

</div>

<!-- APP -->

<div id="appPage">

    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                <h2>Service Company</h2>
                <p>Информационная система</p>
            </div>

            <div class="user">
                <strong id="userName">—</strong>
                <span id="userEmail">—</span>

                <div class="role" id="roleText">
                    CLIENT
                </div>
            </div>

            <nav class="menu">

                <button id="profileBtn">
                    👤 Мой профиль
                </button>

                <button id="equipmentBtn">
                    🔧 Моё оборудование
                </button>

                <button id="requestsBtn">
                    📋 Мои заявки
                </button>

            </nav>

            <button
                    class="logout"
                    id="logoutBtn">
                Выйти
            </button>

        </aside>

        <main class="content">

            <h1 id="pageTitle">
                Мой профиль
            </h1>

            <br>

            <div id="view"></div>

        </main>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
