<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Восстановление пароля</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
        body{background:#eef2f7;display:flex;height:100vh;justify-content:center;align-items:center}
        .card{width:420px;background:#fff;padding:35px;border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
        h1{margin-bottom:10px}
        p{color:#64748b;margin-bottom:20px}
        input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-bottom:16px}
        button{width:100%;padding:12px;background:#2563eb;color:#fff;border:none;border-radius:10px;cursor:pointer}
        #msg{margin-top:18px;font-size:14px}
        .success{color:#15803d}
        .error{color:#dc2626}
    </style>
</head>
<body>

<div class="card">

    <h1>Забыли пароль?</h1>

    <p>Введите Email, и мы отправим ссылку для восстановления.</p>

    <input id="email" placeholder="Email">

    <button onclick="send()">Отправить письмо</button>

    <div id="msg"></div>

</div>

<script>

    const AUTH="http://localhost:8081";

    async function send(){

        msg.className="";
        msg.innerText="";

        const response=await fetch(`${AUTH}/api/auth/forgot-password`,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                email:email.value
            })

        });

        const data=await response.json();

        if(response.ok){

            msg.className="success";
            msg.innerText=data.message;

        }else{

            msg.className="error";
            msg.innerText=data.message;

        }

    }

</script>

</body>
</html>
