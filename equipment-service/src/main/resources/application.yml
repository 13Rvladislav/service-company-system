server:
  port: 8083

spring:
  application:
    name: equipment-service

  datasource:
    url: jdbc:postgresql://localhost:5433/equipment_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:29092

    producer:
      client-id: equipment-service
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

    consumer:
      client-id: equipment-service-user-equipment
      group-id: equipment-service-user-equipment-group
      auto-offset-reset: latest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: ru.servicecompany.equipment.kafka.event.EquipmentRequestEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: ru.servicecompany.equipment.kafka.event

springdoc:
  swagger-ui:
    path: /swagger

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

logging:
  level:
    org.springframework.security: INFO
    org.springframework.kafka: INFO
    org.springframework.kafka.config: INFO
    org.springframework.kafka.listener: INFO
    org.apache.kafka.clients.consumer: INFO